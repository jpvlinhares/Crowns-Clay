name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b                                        # typecheck + build
      - run: npx eslint .                                      # boundary rules (TDD §3)
      - run: node --test "packages/*/dist/**/*.test.js"
      - name: Golden replays (Node engine)
        run: node packages/tools/dist/replay.js verify all     # determinism gate (TDD §5)

  benchmarks:
    # doc 11 §6, made real at M47.9 (doc 12 R1): the named benchmark scenes gate every PR on
    # the ABSOLUTE sim budgets of doc 11 §2 (mean tick ≤10 ms, AI share ≤30%) over the unified
    # campaign composition. Absolute budgets, not regression-vs-baseline — doc 11 §6's M47.9
    # delta records the divergence honestly.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: node packages/tools/dist/bench-scenes.js all

  balance-matrix:
    # M62 (doc 12 Phase 9, ADR-ratified 2026-07-27): the outcome-band gate over the SHIPPING
    # composition (`bench:balance --real`), not the flat harness M22-M46 pinned. Bands: adult
    # cohort (10th-pct village ≥30%, hard 15% floor >10y old), war (≥1 village changes hands in
    # ≥50% of campaigns — gated; aggregate rate reported only), victory timing (no victory
    # before year 30 — gated; median reported), monoculture (no single victory type >60% of
    # wins). --years 60 --seeds 2 matches the figures recorded in doc 12/15 (~6 min wall time);
    # the tool's own default (100y × 3 seeds) is heavier and not needed to exercise the bands.
    #
    # EXPECTED RED on this branch until Phase 9's fix milestones (M64b/M65/M66) land — that is
    # the point: a gate written BEFORE the fixes it measures cannot be reshaped to match them.
    # Do not "fix" a failure here by loosening a band; read doc 15's ADR-5/ADR-6 and doc 12's
    # Phase 9 rows for which milestone owns the underlying defect.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: node packages/tools/dist/bench-balance.js --real --years 60 --seeds 2

  determinism-cross-engine:
    # OQ-10 sentinel: the same compiled modules must hash identically in V8
    # (Chromium) and SpiderMonkey (Firefox) as in the committed Node fixtures.
    # Any divergence here triggers the fixed-point migration decision (doc 14).
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify golden replays in ${{ matrix.browser }}
        run: |
          python3 -m http.server 8080 &
          npx playwright screenshot --browser=${{ matrix.browser }} \
            --wait-for-timeout=60000 http://localhost:8080/packages/tools/browser-harness/ /tmp/harness.png || true
          node - << 'JS'
          // Poll window.__DETERMINISM__ via Playwright until done, assert ok.
          const { chromium, firefox } = require('playwright');
          const engine = process.env.BROWSER === 'firefox' ? firefox : chromium;
          (async () => {
            const browser = await engine.launch();
            const page = await browser.newPage();
            await page.goto('http://localhost:8080/packages/tools/browser-harness/');
            const result = await page.waitForFunction(
              () => window.__DETERMINISM__ && window.__DETERMINISM__.done, null, { timeout: 120000 },
            ).then(() => page.evaluate(() => window.__DETERMINISM__));
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
            if (!result.ok) process.exit(1);
          })();
          JS
        env:
          BROWSER: ${{ matrix.browser }}

  pwa-offline-coldstart:
    # roadmap M44 (doc 03 §9 "PWA service worker handles offline asset caching"; doc 11 "cold start
    # (cached PWA) ≤3s"). Proves the hand-rolled service worker (packages/app/public/sw.js) actually
    # makes a SECOND load boot the game with the network cut — not just that the file exists.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - name: Online visit (installs the SW + populates its cache), then reload OFFLINE
        run: |
          python3 -m http.server 8081 --directory dist-web &
          node - << 'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('http://localhost:8081/');
            await page.waitForFunction(() => navigator.serviceWorker.controller !== null, null, { timeout: 30000 });
            await page.waitForSelector('header');
            const context = page.context();
            await context.setOffline(true);
            await page.reload();
            await page.waitForSelector('header', { timeout: 15000 }); // the real assertion: this must NOT time out
            console.log('offline reload OK: app shell rendered with the network cut');
            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
